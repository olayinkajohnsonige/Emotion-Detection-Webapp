<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1> Emotion Detector</h1>
        <p>Upload a photo to see how you're feeling.</p>
        
        <div class="card">
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label>Your Name</label>
                    <input type="text" name="name" placeholder="e.g. Alex" required>
                </div>
                <div class="input-group">
                    <label>Choose a Photo</label>
                    <input type="file" name="image" required>
                </div>
                <button type="submit" class="btn">Detect Emotion</button>
            </form>
        </div>

        {% if result %}
        <div class="results-card">
            <h3>Detection Results</h3>
            <img src="{{ img }}" class="user-img">
            <div class="emotion-label">
                <span>Detected Emotion:</span>
                <strong>{{ result }}</strong>
            </div>
            <br>
            <a href="/" class="retry-link">Try another one</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
